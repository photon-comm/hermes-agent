# Checks photon.jsonc, the file that tells Photon what this template needs.
# The checker lives in .github/photon until @photon-ai/template ships.
name: photon.jsonc

on:
  pull_request:
    paths:
      - photon.jsonc
      - .github/photon/**
      - .github/workflows/photon-template.yml
  push:
    branches: [main]
    paths:
      - photon.jsonc
      - .github/photon/**
      - .github/workflows/photon-template.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci --prefix .github/photon/tools
      - run: node .github/photon/tools/check.mjs photon.jsonc
